name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1'   # Weekly Monday 2:30 AM UTC
  workflow_dispatch:         # Manual trigger — used by SecurityPilot after PR merge

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # already latest

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended covers CWE-89, CWE-79, CWE-22.
          # CWE-798 (HardcodedCredentialsApiCall) is @precision low so excluded
          # from security-extended — added explicitly for Java only via ternary.
          queries: ${{ matrix.language == 'java' && 'security-extended,codeql/java-queries:Security/CWE/CWE-798/HardcodedCredentialsApiCall.ql' || 'security-extended' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Note: add-snippets was removed from codeql-action and no longer works.
          # SecurityPilot's Phase 1 enrichment uses the GitHub Contents API to fetch
          # affected code snippets (the designed fallback path).
          upload: true
