name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1'   # Weekly Monday 2:30 AM UTC
  workflow_dispatch:         # Manual trigger — used by SecurityPilot after PR merge

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # already latest

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Java uses a local .qls file that extends security-extended with
          # CWE-798 (HardcodedCredentialsApiCall, @precision low, excluded from
          # security-extended by default). Local .qls files support 'from: pack'
          # imports and work with both local and remote CodeQL runners.
          # Python uses security-extended directly (no extra queries needed).
          queries: ${{ matrix.language == 'java' && '.github/codeql/java-security-with-cwe798.qls' || 'security-extended' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Note: add-snippets was removed from codeql-action and no longer works.
          # SecurityPilot's Phase 1 enrichment uses the GitHub Contents API to fetch
          # affected code snippets (the designed fallback path).
          upload: true
