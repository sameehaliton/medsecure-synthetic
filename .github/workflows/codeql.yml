name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1'   # Weekly Monday 2:30 AM UTC
  workflow_dispatch:         # Manual trigger — used by SecurityPilot after PR merge

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # already latest

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Java uses a config file to add CWE-798 (HardcodedCredentialsApiCall,
          # @precision low) on top of security-extended. Python uses queries input
          # directly since it doesn't need extra queries.
          # The queries input must be empty when config-file is set (config wins).
          config-file: ${{ matrix.language == 'java' && '.github/codeql/java-config.yml' || '' }}
          queries: ${{ matrix.language != 'java' && 'security-extended' || '' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Note: add-snippets was removed from codeql-action and no longer works.
          # SecurityPilot's Phase 1 enrichment uses the GitHub Contents API to fetch
          # affected code snippets (the designed fallback path).
          upload: true
